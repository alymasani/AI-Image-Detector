# Model B: ImageNet-pretrained ResNet-18, fully fine-tuned: the collaborator's model definition
# (collaborator/resnet18_project, integrated as src/models/resnet18.py) trained with the SHARED protocol
# (same manifests, preprocessing, Adam, early stopping on val loss) so the comparison with the CNN is fair.
inherits: cnn.yaml
experiment_name: resnet18

model:
  name: resnet18
  pretrained: true             # Torchvision IMAGENET1K_V1 weights; fails loudly if unavailable
  freeze_backbone: false       # full fine-tuning

training:
  learning_rate: 0.0001
