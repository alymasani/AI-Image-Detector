# Model A: custom four-block CNN trained from scratch (our primary model).
experiment_name: cnn

model:
  name: cnn
  dropout: 0.3

data:
  root: data/genimage          # overridden by --data-root / GENIMAGE_ROOT
  manifest_dir: manifests
  train_manifest: train.csv
  val_manifest: val.csv
  image_size: 224
  interpolation: bilinear      # PIL bilinear with antialiasing on downscale
  jpeg_quality: 95             # standardised re-encode for BOTH classes; null disables (experiment E4)
  normalize: imagenet          # mean [0.485,0.456,0.406], std [0.229,0.224,0.225]
  augment:
    hflip: true
    random_crop_padding: 8     # reflect-pad by 8 px then random 224 crop (small translation, no resampling)
  cache_dir: data/cache        # standardised-image cache (prepare_data.py cache); missing files are computed on the fly, bit-identically
  num_workers: 4
  train_limit: null            # per-class cap for pilot runs (null = full manifest)
  val_limit: null

training:
  seed: 42
  batch_size: 32
  learning_rate: 0.001
  optimizer: adam
  weight_decay: 0.0001         # Adam's coupled L2 penalty (torch.optim.Adam weight_decay)
  max_epochs: 20
  early_stopping_patience: 4
  early_stopping_min_delta: 0.0001
  mixed_precision: true        # only takes effect on CUDA; the actual mode is recorded per run
  grad_accum_steps: 1
  device: auto                 # auto | cuda | mps | cpu
  log_every_batches: 100

output:
  runs_dir: runs
  checkpoints_dir: checkpoints
